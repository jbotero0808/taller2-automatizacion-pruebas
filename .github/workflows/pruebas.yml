name: Pruebas Automatizadas CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  pruebas:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar pruebas automatizadas
        run: python ejecutar_pruebas.py

      - name: Subir evidencias (capturas de pantalla)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias
          path: evidencias/

      - name: Subir reporte HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas
          path: reportes/reporte_pruebas.html
